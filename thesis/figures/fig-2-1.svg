<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570"><defs><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#4a5568"/></marker><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2f855a"/></marker></defs><rect width="760" height="570" fill="#ffffff"/><rect x="170" y="24" width="420" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="380.0" y="48.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">启动 Spring Boot 应用（SpringApplication.run）</text><rect x="170" y="100" width="420" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="380.0" y="124.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">@SpringBootApplication 触发组件扫描与自动配置</text><rect x="170" y="176" width="420" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="380.0" y="200.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">读取 META-INF/spring/*.imports 自动配置类清单</text><rect x="170" y="344" width="420" height="48" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="380.0" y="368.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">注册条件满足的 Bean（数据源、Web、Redis 等）</text><rect x="170" y="420" width="420" height="48" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="380.0" y="444.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">用户 @Configuration 定义的 Bean 覆盖默认配置</text><rect x="170" y="496" width="420" height="48" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="380.0" y="520.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">ApplicationContext 就绪，系统启动完成</text><line x1="380" y1="72" x2="380" y2="100" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="148" x2="380" y2="176" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="224" x2="380" y2="228" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="392" x2="380" y2="420" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="468" x2="380" y2="496" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="380,228.0 600.0,270 380,312.0 160.0,270" fill="#fffbea" stroke="#b7791f" stroke-width="1.6"/><text x="380" y="261.225" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">条件注解评估：@ConditionalOnClass /</text><text x="380" y="278.77500000000003" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">OnBean / OnProperty 等是否满足</text><rect x="416.97" y="318.64" width="14.06" height="18.72" fill="#ffffff"/><text x="424" y="328" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">是</text><line x1="380" y1="312" x2="380" y2="344" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="620" y="246" width="126" height="48" rx="6" fill="#f7fafc" stroke="#718096" stroke-width="1.6"/><text x="683.0" y="261.225" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">条件不满足</text><text x="683.0" y="278.77500000000003" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">跳过该配置</text><line x1="600" y1="270" x2="616" y2="270" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="600.97" y="244.64" width="14.06" height="18.72" fill="#ffffff"/><text x="608" y="254" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">否</text><polyline points="683,294 683,520 594,520" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/></svg>