<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690"><defs><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#4a5568"/></marker><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2f855a"/></marker></defs><rect width="1120" height="690" fill="#ffffff"/><rect x="35.0" y="30" width="150" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="110.0" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">用户</text><line x1="110" y1="78" x2="110" y2="656" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="255.0" y="30" width="150" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="330.0" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">用户端（前端）</text><line x1="330" y1="78" x2="330" y2="656" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="485.0" y="30" width="150" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="560.0" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">后端订单支付服务</text><line x1="560" y1="78" x2="560" y2="656" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="725.0" y="30" width="150" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="800.0" y="54.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">模拟收银台</text><line x1="800" y1="78" x2="800" y2="656" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="6 6"/><rect x="935.0" y="30" width="150" height="48" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="1010.0" y="44.55" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">数据库</text><text x="1010.0" y="63.45" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">MySQL</text><line x1="1010" y1="78" x2="1010" y2="656" stroke="#a0aec0" stroke-width="1.3" stroke-dasharray="6 6"/><line x1="110" y1="120" x2="330" y2="120" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="220.0" y="106" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">1. 点击支付，选择支付方式</text><line x1="330" y1="165" x2="560" y2="165" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="445.0" y="151" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">2. POST /api/shop/order/{orderNo}/pay</text><line x1="560" y1="210" x2="1010" y2="210" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="785.0" y="196" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">3. 创建支付流水（status=待支付，写超时时间）</text><line x1="560" y1="255" x2="330" y2="255" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="445.0" y="241" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">4. 返回收银台参数</text><line x1="330" y1="300" x2="800" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="565.0" y="286" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">5. 跳转模拟收银台，选择微信/支付宝</text><line x1="800" y1="345" x2="560" y2="345" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="680.0" y="331" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">6. POST /pay/mock/notify 支付回调</text><line x1="560" y1="390" x2="1010" y2="390" stroke="#c53030" stroke-width="1.6" marker-end="url(#ar)"/><text x="785.0" y="376" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">7. 幂等校验：pay_no 唯一、status≠成功</text><polyline points="560,432 606,432 606,454 562,454" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="614" y="443" font-size="13" text-anchor="start" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">8. 校验订单归属与状态</text><line x1="560" y1="500" x2="1010" y2="500" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="785.0" y="486" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">9. 更新 t_payment 成功、t_order 已支付</text><polyline points="560,542 606,542 606,564 562,564" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="614" y="553" font-size="13" text-anchor="start" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">10. 状态机：WAIT_PAY → WAIT_ACCEPT，写流转日志</text><line x1="560" y1="600" x2="330" y2="600" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="445.0" y="586" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">11. 返回 code=200，订单进入待接单</text><line x1="330" y1="640" x2="110" y2="640" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><text x="220.0" y="626" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">12. 展示支付成功与状态时间轴</text></svg>