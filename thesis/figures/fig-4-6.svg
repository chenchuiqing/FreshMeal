 x1="570" y1="646" x2="606" y2="646" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="580.97" y="620.64" width="14.06" height="18.72" fill="#ffffff"/><text x="588" y="630" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">是</text><polyline points="700,670 800,670 800,806 500,806 500,826" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="400,712.0 580.0,750 400,788.0 220.0,750" fill="#fffbea" stroke="#b7791f" stroke-width="1.6"/><text x="400" y="750.0" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">商品金额 ≥ 免运门槛？</text><line x1="400" y1="788" x2="400" y2="830" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="436.97" y="800.64" width="14.06" height="18.72" fill="#ffffff"/><text x="444" y="810" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">否</text><rect x="610" y="730" width="180" height="44" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="700.0" y="743.225" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">运费置 0</text><text x="700.0" y="760.775" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">（满额免运）</text><line x1="580" y1="750" x2="606" y2="750" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="585.97" y="724.64" width="14.06" height="18.72" fill="#ffffff"/><text x="593" y="734" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">是</text><polyline points="700,774 700,806" fill="n