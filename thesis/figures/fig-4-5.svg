<svg xmlns="http://www.w3.org/2000/svg" width="860" height="930" viewBox="0 0 860 930"><defs><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#4a5568"/></marker><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#c53030"/></marker><marker id="arg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2f855a"/></marker></defs><rect width="860" height="930" fill="#ffffff"/><ellipse cx="430" cy="46" rx="90.0" ry="27.0" fill="#f7fafc" stroke="#718096" stroke-width="1.6"/><text x="430" y="46.0" font-size="15" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">开始派单</text><rect x="220" y="90" width="420" height="52" rx="6" fill="#e8f4ff" stroke="#2b6cb0" stroke-width="1.6"/><text x="430.0" y="116.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">订单流转至待配送，触发派单</text><rect x="220" y="178" width="420" height="88" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="430.0" y="204.45" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">候选集筛选（SQL 条件）：</text><text x="430.0" y="222.0" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">账号启用 &amp; 在线 &amp; 空闲；覆盖收货区域；</text><text x="430.0" y="239.54999999999998" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">在途单量 &lt; 负载上限</text><rect x="220" y="436" width="420" height="96" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="430.0" y="457.675" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">三因子归一化打分：</text><text x="430.0" y="475.225" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">距离分 = max(0, 1 − d/10km)</text><text x="430.0" y="492.77500000000003" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">负载分 = 1 − 在途单量/上限</text><text x="430.0" y="510.32500000000005" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">评分分 = rating / 5</text><rect x="220" y="556" width="420" height="56" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="430.0" y="584.0" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">加权求和：score = 0.5×距离 + 0.3×负载 + 0.2×评分</text><rect x="220" y="636" width="420" height="52" rx="6" fill="#eaf7ef" stroke="#2f855a" stroke-width="1.6"/><text x="430.0" y="662.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">按综合得分降序排序，取最高者</text><rect x="220" y="712" width="420" height="52" rx="6" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="430.0" y="738.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">写入派单日志（各因子得分与选中结果）</text><rect x="220" y="788" width="420" height="52" rx="6" fill="#fff4e5" stroke="#c05621" stroke-width="1.6"/><text x="430.0" y="814.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">分配配送单，状态置为已分配</text><line x1="430" y1="142" x2="430" y2="178" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="266" x2="430" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><polygon points="430,300.0 600.0,340 430,380.0 260.0,340" fill="#fffbea" stroke="#b7791f" stroke-width="1.6"/><text x="430" y="340.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">候选集为空？</text><line x1="430" y1="380" x2="430" y2="436" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="466.97" y="398.64" width="14.06" height="18.72" fill="#ffffff"/><text x="474" y="408" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">否</text><rect x="640" y="316" width="200" height="56" rx="6" fill="#f7fafc" stroke="#718096" stroke-width="1.6"/><text x="740.0" y="335.225" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">等待配送员抢单</text><text x="740.0" y="352.77500000000003" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">或管理员指派</text><line x1="600" y1="340" x2="636" y2="340" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><rect x="610.97" y="314.64" width="14.06" height="18.72" fill="#ffffff"/><text x="618" y="324" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#2d3748">是</text><line x1="430" y1="142" x2="430" y2="178" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="266" x2="430" y2="436" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="532" x2="430" y2="556" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="612" x2="430" y2="636" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="688" x2="430" y2="712" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="764" x2="430" y2="788" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430" y1="840" x2="430" y2="858" stroke="#4a5568" stroke-width="1.6" marker-end="url(#ar)"/><ellipse cx="430" cy="886" rx="90.0" ry="27.0" fill="#f7fafc" stroke="#718096" stroke-width="1.6"/><text x="430" y="886.0" font-size="15" text-anchor="middle" dominant-baseline="central" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" fill="#1a202c">结束</text></svg>